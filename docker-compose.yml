services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: umbraco-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Jump2^Music$
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
